<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — Heftin Academy</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700;900&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- ================================
         ANIMATED BACKGROUND
    ================================= -->

    <div class="background">

        <div class="circle circle-one"></div>

        <div class="circle circle-two"></div>

        <div class="circle circle-three"></div>

    </div>



    <!-- ================================
         MAIN
    ================================= -->

    <main class="auth-wrapper">


        <!-- ================================
             LOGIN CARD
        ================================= -->

        <section class="auth-card">


            <!-- ================================
                 LOGO
            ================================= -->

            <div class="brand">

                <div class="brand-icon">
                    <img src="images/logo.jpeg" alt="Heftin Academy" class="brand-icon-img">
                </div>

                <span>Heftin Academy</span>

            </div>



            <!-- ================================
                 HEADING
            ================================= -->

            <div class="auth-heading">

                <h1><span class="line-1">Welcome</span><span class="line-2">back</span></h1>

                <p>
                    Sign in to continue to your account
                </p>

            </div>



            <!-- ================================
                 LOGIN FORM
            ================================= -->

            <form id="loginForm" novalidate>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email address
                    </label>


                    <div class="input-wrapper">


                        <!-- Email icon -->

                        <span class="input-icon">

                            <svg
                                width="19"
                                height="19"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >

                                <rect
                                    x="3"
                                    y="5"
                                    width="18"
                                    height="14"
                                    rx="2"
                                ></rect>

                                <path
                                    d="m3 7 9 6 9-6"
                                ></path>

                            </svg>

                        </span>


                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                        >

                    </div>


                    <small
                        class="error-message"
                        id="emailError"
                    ></small>

                </div>



                <!-- PASSWORD -->

                <div class="form-group">


                    <div class="label-row">

                        <label for="password">
                            Password
                        </label>


                        <a
                            href="forgot-password.html"
                            class="forgot-link"
                        >
                            Forgot password?
                        </a>

                    </div>



                    <div class="input-wrapper">


                        <!-- Lock icon -->

                        <span class="input-icon">

                            <svg
                                width="19"
                                height="19"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >

                                <rect
                                    x="4"
                                    y="10"
                                    width="16"
                                    height="11"
                                    rx="2"
                                ></rect>

                                <path
                                    d="M8 10V7a4 4 0 0 1 8 0v3"
                                ></path>

                            </svg>

                        </span>



                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                        >



                        <!-- Password toggle -->

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Show password"
                        >


                            <!-- Eye open -->

                            <svg
                                id="eyeOpen"
                                width="19"
                                height="19"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >

                                <path
                                    d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                                ></path>

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                ></circle>

                            </svg>


                            <!-- Eye closed -->

                            <svg
                                id="eyeClosed"
                                class="hidden"
                                width="19"
                                height="19"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            >

                                <path
                                    d="m3 3 18 18"
                                ></path>

                                <path
                                    d="M10.6 10.6a2 2 0 0 0 2.8 2.8"
                                ></path>

                                <path
                                    d="M9.9 4.2A10.6 10.6 0 0 1 12 4c6.5 0 10 8 10 8a18.7 18.7 0 0 1-3.1 4.4"
                                ></path>

                                <path
                                    d="M6.2 6.2C3.5 8.2 2 12 2 12s3.5 8 10 8c1.8 0 3.4-.5 4.8-1.2"
                                ></path>

                            </svg>


                        </button>


                    </div>


                    <small
                        class="error-message"
                        id="passwordError"
                    ></small>


                </div>



                <!-- ================================
                     REMEMBER ME
                ================================= -->

                <div class="form-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        <span class="custom-checkbox"></span>

                        <span>
                            Remember me
                        </span>

                    </label>

                </div>



                <!-- FORM MESSAGE -->

                <div
                    id="formMessage"
                    class="form-message"
                ></div>



                <!-- ================================
                     LOGIN BUTTON
                ================================= -->

                <button
                    type="submit"
                    class="primary-button"
                    id="loginButton"
                >


                    <span
                        id="buttonText"
                        class="button-text"
                    >
                        Sign in
                    </span>


                    <span
                        id="loader"
                        class="loader hidden"
                    ></span>


                    <span
                        id="buttonArrow"
                        class="button-arrow"
                    >
                        →
                    </span>


                </button>


            </form>



            <!-- ================================
                 DIVIDER
            ================================= -->

            <div class="divider">

                <span></span>

                <p>or</p>

                <span></span>

            </div>



            <!-- ================================
                 SIGN UP
            ================================= -->

            <p class="bottom-text">

                Don't have an account?

                <a href="signup.html">
                    Create an account
                </a>

            </p>


        </section>


    </main>



    <!-- JavaScript -->

    <script src="js/script.js"></script>


</body>

</html>
