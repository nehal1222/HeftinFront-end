name: Deploy Heftin Academy frontend

on:
  push:
    branches:
      - main
      - feature/HAC01-FE-02-ui-design-system-conventions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: heftin-academy-frontend/package-lock.json

      - name: Install dependencies
        working-directory: heftin-academy-frontend
        run: npm ci

      - name: Build frontend
        working-directory: heftin-academy-frontend
        run: npm run build

      - name: Add SPA fallback
        run: cp heftin-academy-frontend/dist/index.html heftin-academy-frontend/dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: heftin-academy-frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
