<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password — Heftin Academy</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700;900&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- ================================
         ANIMATED BACKGROUND
    ================================= -->

    <div class="background">

        <div class="circle circle-one"></div>

        <div class="circle circle-two"></div>

        <div class="circle circle-three"></div>

    </div>



    <!-- ================================
         MAIN
    ================================= -->

    <main class="auth-wrapper">


        <!-- ================================
             FORGOT PASSWORD CARD
        ================================= -->

        <section class="auth-card">


            <!-- ================================
                 LOGO
            ================================= -->

            <div class="brand">

                <div class="brand-icon">
                    <img src="images/logo.jpeg" alt="Heftin Academy" class="brand-icon-img">
                </div>

                <span>Heftin Academy</span>

            </div>



            <!-- ================================
                 FORM VIEW
            ================================= -->

            <div id="formView">

                <div class="auth-heading">

                    <h1><span class="line-1">Forgot</span><span class="line-2">password</span></h1>

                    <p>
                        No worries — enter your email and we'll send you a link to reset it.
                    </p>

                </div>


                <form id="forgotForm" novalidate>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email address
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">

                                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                                    <path d="m3 7 9 6 9-6"></path>
                                </svg>

                            </span>

                            <input
                                type="email"
                                id="email"
                                placeholder="you@example.com"
                                autocomplete="email"
                            >

                        </div>

                        <small class="error-message" id="emailError"></small>

                    </div>


                    <!-- FORM MESSAGE -->

                    <div id="formMessage" class="form-message"></div>


                    <!-- SUBMIT -->

                    <button type="submit" class="primary-button" id="submitButton">

                        <span id="buttonText" class="button-text">
                            Send reset link
                        </span>

                        <span id="loader" class="loader hidden"></span>

                        <span id="buttonArrow" class="button-arrow">→</span>

                    </button>

                </form>


                <p class="bottom-text">
                    Remembered your password?
                    <a href="login.html">Back to sign in</a>
                </p>

            </div>



            <!-- ================================
                 SUCCESS VIEW (hidden until submit)
            ================================= -->

            <div id="successView" class="auth-success hidden">

                <div class="auth-success-icon">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                        <path d="m3 7 9 6 9-6"></path>
                    </svg>
                </div>

                <h2>Check your inbox</h2>

                <p>
                    We've sent a password reset link to
                </p>

                <p class="sent-to" id="sentToEmail"></p>

                <div class="auth-success-actions">

                    <p class="resend-row">
                        Didn't get the email?
                        <button type="button" class="resend-link" id="resendButton">Resend</button>
                    </p>

                    <!-- Demo-only: no real inbox exists in this prototype, so this
                         link lets you actually see the Reset Password screen. -->
                    <a href="reset-password.html" class="forgot-link">
                        Demo: continue to reset password →
                    </a>

                    <p class="bottom-text">
                        <a href="login.html">Back to sign in</a>
                    </p>

                </div>

            </div>


        </section>


    </main>



    <!-- JavaScript -->

    <script src="js/forgot-password.js"></script>


</body>

</html>
