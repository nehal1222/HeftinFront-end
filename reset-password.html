<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password — Heftin Academy</title>

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700;900&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <!-- ================================
         ANIMATED BACKGROUND
    ================================= -->

    <div class="background">

        <div class="circle circle-one"></div>

        <div class="circle circle-two"></div>

        <div class="circle circle-three"></div>

    </div>



    <!-- ================================
         MAIN
    ================================= -->

    <main class="auth-wrapper">


        <!-- ================================
             RESET PASSWORD CARD
        ================================= -->

        <section class="auth-card">


            <!-- ================================
                 LOGO
            ================================= -->

            <div class="brand">

                <div class="brand-icon">
                    <img src="images/logo.jpeg" alt="Heftin Academy" class="brand-icon-img">
                </div>

                <span>Heftin Academy</span>

            </div>



            <!-- ================================
                 FORM VIEW
            ================================= -->

            <div id="formView">

                <div class="auth-heading">

                    <h1><span class="line-1">Reset</span><span class="line-2">password</span></h1>

                    <p>
                        Choose a new password for your account.
                    </p>

                </div>


                <form id="resetForm" novalidate>


                    <!-- NEW PASSWORD -->

                    <div class="form-group">

                        <label for="newPassword">
                            New password
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="4" y="10" width="16" height="11" rx="2"></rect>
                                    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                                </svg>
                            </span>

                            <input
                                type="password"
                                id="newPassword"
                                placeholder="Enter new password"
                                autocomplete="new-password"
                            >

                            <button type="button" class="password-toggle" id="newPasswordToggle" aria-label="Show password">

                                <svg id="newEyeOpen" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>

                                <svg id="newEyeClosed" class="hidden" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="m3 3 18 18"></path>
                                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                                    <path d="M9.9 4.2A10.6 10.6 0 0 1 12 4c6.5 0 10 8 10 8a18.7 18.7 0 0 1-3.1 4.4"></path>
                                    <path d="M6.2 6.2C3.5 8.2 2 12 2 12s3.5 8 10 8c1.8 0 3.4-.5 4.8-1.2"></path>
                                </svg>

                            </button>

                        </div>

                        <small class="error-message" id="newPasswordError"></small>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm new password
                        </label>

                        <div class="input-wrapper">

                            <span class="input-icon">
                                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="4" y="10" width="16" height="11" rx="2"></rect>
                                    <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                                </svg>
                            </span>

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Re-enter new password"
                                autocomplete="new-password"
                            >

                            <button type="button" class="password-toggle" id="confirmPasswordToggle" aria-label="Show password">

                                <svg id="confirmEyeOpen" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>

                                <svg id="confirmEyeClosed" class="hidden" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="m3 3 18 18"></path>
                                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                                    <path d="M9.9 4.2A10.6 10.6 0 0 1 12 4c6.5 0 10 8 10 8a18.7 18.7 0 0 1-3.1 4.4"></path>
                                    <path d="M6.2 6.2C3.5 8.2 2 12 2 12s3.5 8 10 8c1.8 0 3.4-.5 4.8-1.2"></path>
                                </svg>

                            </button>

                        </div>

                        <small class="error-message" id="confirmPasswordError"></small>

                    </div>


                    <!-- FORM MESSAGE -->

                    <div id="formMessage" class="form-message"></div>


                    <!-- SUBMIT -->

                    <button type="submit" class="primary-button" id="submitButton">

                        <span id="buttonText" class="button-text">
                            Reset password
                        </span>

                        <span id="loader" class="loader hidden"></span>

                        <span id="buttonArrow" class="button-arrow">→</span>

                    </button>

                </form>


                <p class="bottom-text">
                    <a href="login.html">Back to sign in</a>
                </p>

            </div>



            <!-- ================================
                 SUCCESS VIEW (hidden until submit)
            ================================= -->

            <div id="successView" class="auth-success hidden">

                <div class="auth-success-icon">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 6 9 17l-5-5"></path>
                    </svg>
                </div>

                <h2>Password updated</h2>

                <p>
                    Your password has been changed successfully. You can now sign in with your new password.
                </p>

                <div class="auth-success-actions">

                    <a href="login.html" class="primary-button">
                        <span class="button-text">Continue to sign in</span>
                        <span class="button-arrow">→</span>
                    </a>

                </div>

            </div>


        </section>


    </main>



    <!-- JavaScript -->

    <script src="js/reset-password.js"></script>


</body>

</html>
